<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đồ chơi mới</title><style>
:root{--bg:#f6f5f2;--ink:#1d1d1b;--mute:#65635e;--card:#fff;--line:#dedbd4;--pick:#1b7a43;--flaw:#a3461d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--ink:#ecebe7;--mute:#a7a59f;--card:#232321;--line:#3a3936;--pick:#5cc48a;--flaw:#e59a72}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;margin:0 0 4px} .lead{color:var(--mute);margin:0 0 24px;max-width:70ch}
h2{font-size:20px;margin:28px 0 12px} h2 span{font-weight:400;color:var(--mute);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
img{display:block;width:100%;aspect-ratio:9/7;object-fit:cover}
figcaption{padding:10px 12px 14px} h3{font-size:16px;margin:0} p{margin:4px 0 0}
.size{color:var(--mute);font-size:14px} .flaw{color:var(--flaw);font-size:14px}
.pick{display:inline-block;background:var(--pick);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px;margin-bottom:6px}
</style></head><body><main><h1>Đồ chơi mới, tháng 10/2026</h1>
<p class="lead">Mỗi concept là một đồ chơi in PETG cầm tay, làm đúng một động tác khi vặn, bóp, lên dây hoặc kéo. Ảnh là ảnh minh hoạ ý tưởng, chưa phải CAD. Chọn bằng số ID (ví dụ N2).</p>
<h2>Vòng 1 <span>17/10/2026: Tìm concept khác → chọn 2 (đồ chơi mới hoàn toàn)</span></h2><div class="grid"><figure><img src="concepts/round1/N1_pumpkin-peekaboo.jpg" alt="Bí ngô ma" loading="lazy"><figcaption><h3>N1 · Bí ngô ma</h3><p class="size">~10 cm</p><p>Vặn cuống bí: nắp nâng lên, con ma trắng nhô ra khỏi quả bí rồi thụt vào.</p><p class="flaw">Lỗi ảnh: Ảnh vẽ nắp lơ lửng, không thấy trục nâng.</p></figcaption></figure><figure><img src="concepts/round1/N2_penguin-slide.jpg" alt="Cầu trượt chim cánh cụt" loading="lazy"><figcaption><h3>N2 · Cầu trượt chim cánh cụt</h3><p class="size">~13 cm cao</p><p>Quay tay: 3 chú chim cánh cụt được đưa lên đỉnh đồi tuyết rồi trượt xuống máng xoắn, chạy vòng mãi.</p></figcaption></figure><figure><img src="concepts/round1/N3_owl-turn.jpg" alt="Cú quay đầu" loading="lazy"><figcaption><h3>N3 · Cú quay đầu</h3><p class="size">~11 cm cao</p><p>Lên dây cót: đầu cú quay ngoái ra sau và mí mắt chớp.</p><p class="flaw">Lỗi ảnh: Đầu chỉ ngoái khoảng 90°, chưa đủ 180°; chìa cót nằm bên hông thay vì sau lưng.</p></figcaption></figure><figure><img src="concepts/round1/N4_dino-chomp.jpg" alt="Sọ khủng long đớp" loading="lazy"><figcaption><h3>N4 · Sọ khủng long đớp</h3><p class="size">~14 cm dài</p><p>Bóp cò dưới hàm: hàm dưới đớp, cổ đốt lắc lư.</p><p class="flaw">Lỗi ảnh: Răng vẽ nhọn (bản thật sẽ bo tròn); không thấy cò bóp.</p></figcaption></figure><figure><img src="concepts/round1/N5_hedgehog-roll.jpg" alt="Nhím lăn xòe gai" loading="lazy"><figcaption><h3>N5 · Nhím lăn xòe gai</h3><p class="size">~9 cm dài</p><p>Đẩy nhím lăn trên bàn: các tấm gai hình lá bật lên xòe thành vương miện rồi xẹp xuống.</p></figcaption></figure><figure><img src="concepts/round1/N6_woodpecker-pole.jpg" alt="Chim gõ kiến" loading="lazy"><figcaption><h3>N6 · Chim gõ kiến</h3><p class="size">~15 cm cao</p><p>Đặt chim lên đỉnh cột: chim tự gõ mỏ, tụt dần xuống từng nấc nhờ vòng kẹp lắc.</p></figcaption></figure><figure><img src="concepts/round1/N7_chameleon-tongue.jpg" alt="Tắc kè thè lưỡi" loading="lazy"><figcaption><h3>N7 · Tắc kè thè lưỡi</h3><p class="size">~12 cm dài</p><p>Bóp đuôi cuộn: lưỡi hồng bắn thẳng ra chạm con ruồi rồi rút về.</p></figcaption></figure><figure><img src="concepts/round1/N8_gingerbread-turn.jpg" alt="Nhà gingerbread xoay" loading="lazy"><figcaption><h3>N8 · Nhà gingerbread xoay</h3><p class="size">~12 cm cao</p><p>Vặn ống khói: cửa chớp mở và bàn xoay có 4 hình nhân gừng chạy qua cửa chính.</p></figcaption></figure></div></main></body></html>
