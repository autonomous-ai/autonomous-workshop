<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intern Christmas Hats</title>
<style>
:root{--bg:#f6f3ee;--fg:#1d1b19;--muted:#6b645c;--card:#fff;--line:#e3ddd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151413;--fg:#f1ece4;--muted:#a49b90;--card:#1f1d1b;--line:#33302c}}
:root[data-theme="dark"]{--bg:#151413;--fg:#f1ece4;--muted:#a49b90;--card:#1f1d1b;--line:#33302c}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
figure img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
figcaption{padding:10px 12px}figcaption b{display:block}figcaption span{color:var(--muted);font-size:13px}
</style></head><body><main>
<h1>Intern Christmas hats</h1>
<p class="sub">8 ideas for a hat that sits tilted on the glowing tip (35 mm base, 32 mm tall), leaving part of the light showing.</p>
<div class="grid">
<figure><img src="concepts/h1_santa-slouch.jpg" alt="H1"><figcaption><b>H1 Santa Slouch</b><span>Classic red hat; the pompom rests on the body</span></figcaption></figure>
<figure><img src="concepts/h2_elf-cap.jpg" alt="H2"><figcaption><b>H2 Elf Cap</b><span>Green cap, zig-zag cuff, gold bell</span></figcaption></figure>
<figure><img src="concepts/h3_holly-beret.jpg" alt="H3"><figcaption><b>H3 Holly Beret</b><span>Cranberry beret at an angle with holly</span></figcaption></figure>
<figure><img src="concepts/h4_pixel-hat.jpg" alt="H4"><figcaption><b>H4 Pixel Santa Hat</b><span>8-bit voxel hat, matches the Pixel Tree Key</span></figcaption></figure>
<figure><img src="concepts/h5_candy-stocking.jpg" alt="H5"><figcaption><b>H5 Candy-Cane Stocking</b><span>Striped tail runs down an edge of the body</span></figcaption></figure>
<figure><img src="concepts/h6_tree-cone.jpg" alt="H6"><figcaption><b>H6 Tree Cone</b><span>Three-tier fir tree with a gold star</span></figcaption></figure>
<figure><img src="concepts/h7_antler-beanie.jpg" alt="H7"><figcaption><b>H7 Antler Beanie</b><span>Knit beanie with small antlers (sits nearly straight)</span></figcaption></figure>
<figure><img src="concepts/h8_gift-bow.jpg" alt="H8"><figcaption><b>H8 Gift Bow Cap</b><span>Cranberry cap with a gold ribbon and bow</span></figcaption></figure>
</div></main></body></html>
