[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-inventor-core"
version = "0.1.0"
description = "Shared, durable infrastructure for autonomous AI inventors"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
inventor-foundation = "inventor_core.cli:main"
# Compatibility alias for the v1 command name.
inventor-core = "inventor_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
