[build-system]
# uv's backend, not setuptools: the Workshop venv installs this tree editable
# (`[tool.uv.sources]`), and setuptools writes `cadgen.egg-info/` and `build/`
# into it. This tree is a fingerprinted skill, so those would drift its
# LOCK.json fingerprint and be copied into every run.
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "cadgen"
version = "0.4.19"
description = "STEP-first CAD artifact generation runtime: build123d STEP/GLB/topology generation, validation, and inspection for CAD agent skills."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "earthtojake" }]
keywords = ["cad", "step", "glb", "build123d", "parametric", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "build123d==0.11.1",
  "cadquery-ocp==7.9.3.1.1",
  "ezdxf",
  "shapely",
]

[project.urls]
Homepage = "https://github.com/earthtojake/text-to-cad"
Repository = "https://github.com/earthtojake/text-to-cad"
Issues = "https://github.com/earthtojake/text-to-cad/issues"

[project.scripts]
cadgen-step-artifact = "cadgen.step_artifact_cli:main"
