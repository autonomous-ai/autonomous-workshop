[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-alice"
version = "0.1.0"
description = "A durable multi-agent inventor for original physical board games"
requires-python = ">=3.11"
dependencies = ["inventor-workshop==0.5.0"]

[project.scripts]
alice = "alice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/autonomous-alice" = ["TASTE.md"]
"share/autonomous-alice/config" = [
  "config/default.json",
  "config/library.json",
  "config/market-signals.json",
]
"share/autonomous-alice/evals" = ["evals/release-policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
inventor-workshop = { path = "../..", editable = true }
