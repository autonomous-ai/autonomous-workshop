<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table replay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1 id="game-title">Table replay</h1>
      <p id="game-concept"></p>
    </div>
    <nav aria-label="Mode">
      <button class="tab active" data-mode="replay">LLM replay</button>
      <button class="tab" data-mode="play">Player vs player</button>
      <button class="tab" data-mode="rules">Rules</button>
    </nav>
  </header>

  <main>
    <aside id="sidebar">
      <section id="replay-controls">
        <label for="run-select">Run</label>
        <select id="run-select"></select>
        <label for="game-select">Game</label>
        <select id="game-select"></select>
        <div class="transport">
          <button id="back" aria-label="Previous turn">←</button>
          <button id="play-pause">Play</button>
          <button id="forward" aria-label="Next turn">→</button>
        </div>
        <input id="timeline" type="range" min="0" max="0" value="0">
      </section>

      <section id="play-controls" hidden>
        <label for="seat-count">Players</label>
        <input id="seat-count" type="number" min="2" max="4" value="2">
        <label for="seed">Seed</label>
        <input id="seed" type="number" value="1">
        <button id="new-game" class="primary">Start hot-seat game</button>
        <p class="help">Run this page through <code>game_site.py serve</code> to play.</p>
      </section>

      <section id="turn-detail"></section>
    </aside>

    <section id="table-area">
      <div id="status"></div>
      <div id="board" aria-label="Game board"></div>
      <details id="raw-state">
        <summary>Raw observation</summary>
        <pre></pre>
      </details>
    </section>

    <aside id="moves-panel">
      <h2>Legal moves</h2>
      <ol id="moves"></ol>
    </aside>

    <article id="rules-panel" hidden></article>
  </main>
  <script src="app.js"></script>
</body>
</html>
