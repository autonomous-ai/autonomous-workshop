<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Spark effort route: Wish to Make to Release</title>
  <desc id="description">Spark is the default and shortest Autonomous Workshop route. New Codex Spark runs freeze low reasoning effort across one native session. Each active stage attempt receives one Codex Goal. Inventor selection happens inside Make. Invent and Playtest are passed through without a turn, artifact, gate, or evidence. Release verifies the CAD and manual, records Playtest as not-run, publishes with public hash readback, and hands the product to Operations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <polygon points="0,0 12,6 0,12" fill="#525b66"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .heading { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .small { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .route { fill: none; stroke: #525b66; stroke-width: 3; marker-end: url(#arrow); }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .manager { fill: #f0f5f4; stroke: #56847c; stroke-width: 2; }
      .active { fill: #fff8ec; stroke: #e8a548; stroke-width: 2.5; }
      .skip { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; stroke-dasharray: 8 6; }
      .release { fill: #fff8ec; stroke: #e8a548; stroke-width: 2.5; }
      .ops { fill: #f4f0ff; stroke: #8b6fc0; stroke-width: 2.5; }
      .orange { fill: #a85e05; }
      .blue { fill: #11689f; }
      .purple { fill: #604092; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#f5f2ec"/>
  <text x="55" y="64" class="eyebrow orange">SPARK · DEFAULT · SHORTEST ROUTE</text>
  <text x="55" y="108" class="title">From a Wish to a published toy—fast.</text>
  <text x="55" y="139" class="subtitle">One native session. Two active creative stages. Passed-through stages leave no pretend work behind.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="185" width="1090" height="68" rx="18" class="manager"/>
  </g>
  <text x="83" y="212" class="eyebrow" fill="#376b61">WORKSHOP MANAGER</text>
  <text x="83" y="237" class="body">Codex Spark freezes low reasoning; every product gate and each stage Goal stays intact.</text>

  <path class="route" d="M 225 355 H 295"/>
  <path class="route" d="M 555 355 H 625"/>
  <path class="route" d="M 885 355 H 955"/>

  <g filter="url(#shadow)"><rect x="55" y="295" width="170" height="120" rx="20" class="node"/></g>
  <text x="80" y="325" class="eyebrow">YOU IMAGINE IT</text>
  <text x="80" y="359" class="heading">WISH</text>
  <text x="80" y="386" class="body">Exact words persisted.</text>

  <g filter="url(#shadow)"><rect x="295" y="285" width="260" height="150" rx="20" class="active"/></g>
  <text x="322" y="315" class="eyebrow orange">CODEX GOAL · SELECT + BUILD</text>
  <text x="322" y="350" class="heading">MAKE</text>
  <text x="322" y="377" class="body">Choose the fitting Inventor,</text>
  <text x="322" y="399" class="body">shape the concept, build CAD,</text>
  <text x="322" y="421" class="body">prove its magic + pass the gate.</text>

  <g filter="url(#shadow)"><rect x="625" y="285" width="260" height="150" rx="20" class="release"/></g>
  <text x="652" y="315" class="eyebrow orange">CODEX GOAL · PACKAGE + PUBLISH</text>
  <text x="652" y="350" class="heading">RELEASE</text>
  <text x="652" y="377" class="body">Seal exact CAD + MANUAL.pdf.</text>
  <text x="652" y="399" class="body">Confirm public hash readback.</text>
  <text x="652" y="421" class="body">Record Playtest: not-run.</text>

  <g filter="url(#shadow)"><rect x="955" y="295" width="190" height="120" rx="20" class="ops"/></g>
  <text x="980" y="325" class="eyebrow purple">PHYSICAL WORK</text>
  <text x="980" y="359" class="heading">OPERATIONS</text>
  <text x="980" y="386" class="body">Print · Deliver · Review</text>

  <text x="55" y="496" class="eyebrow blue">TRUE PASS-THROUGH</text>
  <g filter="url(#shadow)"><rect x="55" y="520" width="520" height="112" rx="18" class="skip"/></g>
  <text x="82" y="553" class="heading">INVENT</text>
  <text x="82" y="580" class="body">Skipped as a standalone stage. Selection and concept work move into Make.</text>
  <text x="82" y="607" class="small blue">NO TURN · NO ARTIFACT · NO GATE</text>

  <g filter="url(#shadow)"><rect x="625" y="520" width="520" height="112" rx="18" class="skip"/></g>
  <text x="652" y="553" class="heading">PLAYTEST</text>
  <text x="652" y="580" class="body">Not run. Release makes no Playtest claim and carries no Playtest evidence.</text>
  <text x="652" y="607" class="small blue">NO TURN · NO ARTIFACT · NO GATE · NO EVIDENCE</text>

  <g filter="url(#shadow)"><rect x="55" y="685" width="1090" height="78" rx="18" fill="#ffffff" stroke="#d7d3cc" stroke-width="2"/></g>
  <text x="82" y="716" class="eyebrow purple">OPERATIONS HANDOFF</text>
  <text x="82" y="743" class="body">Workshop ends only after authenticated publication and exact-byte readback; printing and delivery begin afterward.</text>
</svg>
