<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Quest effort route: Daydream to Invent to Make to Playtest to Release</title>
  <desc id="description">Quest is the fullest Autonomous Workshop route after one liked Daydream idea. New Codex Quest runs bind one deep-v14 profile across the persistent build session. Invent begins with a 20-minute high-reasoning turn, ranks a compact complete-roster Taste index before opening the best three full agents, and uses a 10-minute medium source-finalization recovery when needed. Make begins directly at high reasoning with the normal 60-minute boundary and 256k compaction, reads the exact Wish and sealed Invent result, and persists one coherent complete CAD baseline early. It has no early-proof turn, proof-ready marker, private proof receipt, or proof-to-source handoff; ordinary same-session recovery continues durable product bytes. Playtest and Release use medium reasoning, and one command is capped at eight turns. A fixed preflight generates every printable and requires strict fit, mesh validity, and 0.4 mm-nozzle thickness before final blind review. A proven concept block returns Make to Invent. Failed Playtest returns directly to Make for a build defect or Invent for a concept defect. All repair routes share one revision budget. Release requires passing Playtest evidence bound to the current Made revision, verifies the CAD and manual, publishes with public hash readback, and hands the product to Operations. Frozen deep-v13 runs retain their historical phased Make protocol.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><polygon points="0,0 12,6 0,12" fill="#525b66"/></marker>
    <marker id="arrow-repair" viewBox="0 0 12 12" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><polygon points="0,0 12,6 0,12" fill="#d97706"/></marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .small { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .route { fill: none; stroke: #525b66; stroke-width: 3; marker-end: url(#arrow); }
      .repair { fill: none; stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow-repair); }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .manager { fill: #f0f5f4; stroke: #56847c; stroke-width: 2; }
      .active { fill: #fff8ec; stroke: #e8a548; stroke-width: 2.5; }
      .proof { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; }
      .ops { fill: #f4f0ff; stroke: #8b6fc0; stroke-width: 2.5; }
      .orange { fill: #a85e05; }
      .blue { fill: #11689f; }
      .purple { fill: #604092; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#f5f2ec"/>
  <text x="55" y="64" class="eyebrow orange">QUEST · FULLEST ROUTE</text>
  <text x="55" y="108" class="title">Explore, engineer, and prove the experience.</text>
  <text x="55" y="139" class="subtitle">Quest adds a real Playtest gate and evidence-bound repair routes; Release must bind passing evidence.</text>

  <g filter="url(#shadow)"><rect x="55" y="185" width="1090" height="68" rx="18" class="manager"/></g>
  <text x="83" y="212" class="eyebrow" fill="#376b61">WORKSHOP MANAGER</text>
  <text x="83" y="237" class="body">Codex Quest: Invent 20→10m · Make direct high 60m · ordinary recovery · 256k.</text>

  <path class="route" d="M 205 355 H 210"/>
  <path class="route" d="M 390 355 H 425"/>
  <path class="route" d="M 605 355 H 640"/>
  <path class="route" d="M 820 355 H 855"/>
  <path class="route" d="M 1035 355 H 1070"/>

  <g filter="url(#shadow)"><rect x="55" y="300" width="150" height="110" rx="20" class="node"/></g>
  <text x="76" y="330" class="eyebrow">ALWAYS ON</text>
  <text x="76" y="363" class="heading" style="font-size:22px">DAYDREAM</text>
  <text x="76" y="389" class="body">One liked idea.</text>

  <g filter="url(#shadow)"><rect x="210" y="285" width="180" height="150" rx="20" class="active"/></g>
  <text x="233" y="315" class="eyebrow orange">CODEX GOAL · INVENT</text>
  <text x="233" y="349" class="heading">INVENT</text>
  <text x="233" y="376" class="body">Choose Inventor.</text>
  <text x="233" y="398" class="body">Research + explore.</text>
  <text x="233" y="420" class="body">Verify concept.</text>

  <g filter="url(#shadow)"><rect x="425" y="285" width="180" height="150" rx="20" class="active"/></g>
  <text x="448" y="315" class="eyebrow orange">CODEX GOAL · MAKE</text>
  <text x="448" y="349" class="heading">MAKE</text>
  <text x="448" y="376" class="body">16m · source → 3 exact states.</text>
  <text x="448" y="398" class="body">Same Goal: source 15m → recovery; resume → recovery.</text>
  <text x="448" y="420" class="body">Preflight + review + gate.</text>

  <g filter="url(#shadow)"><rect x="640" y="285" width="180" height="150" rx="20" class="active"/></g>
  <text x="663" y="315" class="eyebrow orange">CODEX GOAL · PLAYTEST</text>
  <text x="663" y="349" class="heading">PLAYTEST</text>
  <text x="663" y="376" class="body">Test exact build.</text>
  <text x="663" y="398" class="body">Record evidence.</text>
  <text x="663" y="420" class="body">Repair failures.</text>

  <g filter="url(#shadow)"><rect x="855" y="285" width="180" height="150" rx="20" class="active"/></g>
  <text x="878" y="315" class="eyebrow orange">CODEX GOAL · RELEASE</text>
  <text x="878" y="349" class="heading">RELEASE</text>
  <text x="878" y="376" class="body">Seal CAD + manual.</text>
  <text x="878" y="398" class="body">Bind passing proof.</text>
  <text x="878" y="420" class="body">Read back hashes.</text>

  <g filter="url(#shadow)"><rect x="1070" y="300" width="75" height="110" rx="20" class="ops"/></g>
  <text x="1108" y="332" text-anchor="middle" class="eyebrow purple">OPS</text>
  <text x="1108" y="365" text-anchor="middle" class="heading">→</text>
  <text x="1108" y="391" text-anchor="middle" class="body">Print</text>

  <path class="repair" d="M 730 445 V 477 H 515 V 445"/>
  <path class="repair" d="M 555 445 V 510 H 300 V 445"/>
  <path class="repair" d="M 775 445 V 543 H 300 V 445"/>
  <text x="622" y="470" text-anchor="middle" class="small orange">PLAYTEST BUILD DEFECT → MAKE</text>
  <text x="427" y="503" text-anchor="middle" class="small orange">PROVEN MAKE CONCEPT BLOCK → INVENT</text>
  <text x="537" y="536" text-anchor="middle" class="small orange">PLAYTEST CONCEPT DEFECT → INVENT</text>
  <text x="900" y="536" text-anchor="middle" class="small orange">ONE SHARED REVISION BUDGET</text>

  <text x="55" y="610" class="eyebrow blue">QUEST RELEASE PROOF</text>
  <g filter="url(#shadow)"><rect x="55" y="635" width="520" height="112" rx="18" class="proof"/></g>
  <text x="82" y="668" class="heading">BOUND PLAYTEST EVIDENCE</text>
  <text x="82" y="695" class="body">Passing evidence names the current Made revision—not an earlier build.</text>
  <text x="82" y="722" class="small blue">PLAYTEST TURN · ARTIFACT · GATE · PASSING EVIDENCE</text>

  <g filter="url(#shadow)"><rect x="625" y="635" width="520" height="112" rx="18" fill="#ffffff" stroke="#d7d3cc" stroke-width="2"/></g>
  <text x="652" y="668" class="heading">PUBLICATION + HANDOFF</text>
  <text x="652" y="695" class="body">Exact CAD and manual hashes are authenticated and read back publicly.</text>
  <text x="652" y="722" class="small purple">THEN OPERATIONS: PRINT · DELIVER · REVIEW</text>

  <g filter="url(#shadow)"><rect x="55" y="789" width="1090" height="50" rx="16" fill="#f4f0ff" stroke="#8b6fc0" stroke-width="2"/></g>
  <text x="600" y="820" text-anchor="middle" class="body">No enabled stage is passed through. Workshop publishes the digital Release; Operations owns every physical step.</text>
</svg>
