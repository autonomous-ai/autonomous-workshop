<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title description">
  <title id="title">The Workshop floorplan</title>
  <desc id="description">A customer Wish moves through Match, Concept, Make, AI Playtest, Instructions, Deliver, and customer Reviews. Concept, Make, and Instructions contain scored internal improvement loops. AI Playtest sends issues back to Make, while human Reviews inform the next revision and future Wishes.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17202a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525b66"/>
    </marker>
    <marker id="arrow-micro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1675b8"/>
    </marker>
    <marker id="arrow-human" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c4dcc"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .legend { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5560; }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .node-internal { fill: #fff8ec; stroke: #e8a548; stroke-width: 2; }
      .node-ai { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; }
      .node-human { fill: #f7f1ff; stroke: #a782dc; stroke-width: 2; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .eyebrow-internal { fill: #a85e05; }
      .eyebrow-ai { fill: #11689f; }
      .eyebrow-human { fill: #6840aa; }
      .heading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .micro-copy { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a85e05; }
      .edge-label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .edge-label-ai { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-human { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6840aa; }
      .flow { fill: none; stroke: #525b66; stroke-width: 2.5; marker-end: url(#arrow-main); }
      .micro { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#arrow-micro); }
      .feedback-ai { fill: none; stroke: #1675b8; stroke-width: 3; marker-end: url(#arrow-ai); }
      .feedback-human { fill: none; stroke: #7c4dcc; stroke-width: 3; marker-end: url(#arrow-human); }
    </style>
  </defs>

  <rect width="1600" height="820" rx="28" fill="#f5f2ec"/>

  <text x="50" y="62" class="title">The Workshop floorplan</text>
  <text x="50" y="94" class="subtitle">One customer journey · three scored micro-loops · two external feedback loops</text>

  <g transform="translate(820 54)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#525b66" stroke-width="3"/>
    <text x="44" y="5" class="legend">main journey</text>
    <path d="M 168 2 C 178 20, 206 20, 216 2" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="228" y="5" class="legend">internal score loop</text>
    <line x1="388" y1="0" x2="422" y2="0" stroke="#1675b8" stroke-width="3"/>
    <text x="432" y="5" class="legend">AI-player feedback</text>
    <line x1="570" y1="0" x2="604" y2="0" stroke="#7c4dcc" stroke-width="3"/>
    <text x="614" y="5" class="legend">human feedback</text>
  </g>

  <!-- Main journey arrows -->
  <path class="flow" d="M 190 310 H 215"/>
  <path class="flow" d="M 390 310 H 415"/>
  <path class="flow" d="M 590 310 H 615"/>
  <path class="flow" d="M 790 310 H 815"/>
  <path class="flow" d="M 1000 310 H 1025"/>
  <path class="flow" d="M 1210 310 H 1235"/>
  <path class="flow" d="M 1390 310 H 1415"/>

  <!-- Wish -->
  <g filter="url(#shadow)">
    <rect class="node" x="40" y="210" width="150" height="200" rx="20"/>
  </g>
  <text x="58" y="240" class="eyebrow">CUSTOMER</text>
  <text x="58" y="276" class="heading">WISH</text>
  <text x="58" y="306" class="body">
    <tspan x="58" dy="0">Describe a toy</tspan>
    <tspan x="58" dy="21">that does not</tspan>
    <tspan x="58" dy="21">exist yet.</tspan>
  </text>
  <text x="58" y="386" class="edge-label">words preserved</text>

  <!-- Match -->
  <g filter="url(#shadow)">
    <rect class="node" x="215" y="210" width="175" height="200" rx="20"/>
  </g>
  <text x="233" y="240" class="eyebrow">AI MANAGER</text>
  <text x="233" y="276" class="heading">MATCH</text>
  <text x="233" y="306" class="body">
    <tspan x="233" dy="0">Read every Taste.</tspan>
    <tspan x="233" dy="21">Choose the best</tspan>
    <tspan x="233" dy="21">Inventor. Explain why.</tspan>
  </text>

  <!-- Concept -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="415" y="210" width="175" height="200" rx="20"/>
  </g>
  <text x="433" y="240" class="eyebrow eyebrow-internal">AI INVENTOR · LOOP</text>
  <text x="433" y="276" class="heading">CONCEPT</text>
  <text x="433" y="306" class="body">
    <tspan x="433" dy="0">Research the space.</tspan>
    <tspan x="433" dy="21">Explore distinct ideas.</tspan>
  </text>
  <text x="503" y="357" text-anchor="middle" class="micro-copy">research → explore → score</text>
  <path class="micro" d="M 558 368 C 558 399, 447 399, 447 368"/>
  <rect x="474" y="377" width="58" height="22" rx="11" fill="#fff8ec"/>
  <text x="503" y="394" text-anchor="middle" class="micro-copy">improve</text>

  <!-- Make -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="615" y="210" width="175" height="200" rx="20"/>
  </g>
  <text x="633" y="240" class="eyebrow eyebrow-internal">AI INVENTOR · LOOP</text>
  <text x="633" y="276" class="heading">MAKE</text>
  <text x="633" y="306" class="body">
    <tspan x="633" dy="0">Build the chosen idea.</tspan>
    <tspan x="633" dy="21">Check form + function.</tspan>
  </text>
  <text x="703" y="357" text-anchor="middle" class="micro-copy">build → inspect → score</text>
  <path class="micro" d="M 758 368 C 758 399, 647 399, 647 368"/>
  <rect x="674" y="377" width="58" height="22" rx="11" fill="#fff8ec"/>
  <text x="703" y="394" text-anchor="middle" class="micro-copy">improve</text>

  <!-- Playtest -->
  <g filter="url(#shadow)">
    <rect class="node-ai" x="815" y="210" width="185" height="200" rx="20"/>
  </g>
  <text x="833" y="240" class="eyebrow eyebrow-ai">AI PLAYERS · EXTERNAL</text>
  <text x="833" y="276" class="heading">PLAYTEST</text>
  <text x="833" y="306" class="body">
    <tspan x="833" dy="0">Simulate real use.</tspan>
    <tspan x="833" dy="21">Find failures, exploits,</tspan>
    <tspan x="833" dy="21">and weak strategies.</tspan>
  </text>
  <text x="833" y="386" class="edge-label-ai">evidence, not taste</text>

  <!-- Instructions -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="1025" y="210" width="185" height="200" rx="20"/>
  </g>
  <text x="1043" y="240" class="eyebrow eyebrow-internal">AI INVENTOR · LOOP</text>
  <text x="1043" y="276" class="heading">INSTRUCTIONS</text>
  <text x="1043" y="306" class="body">
    <tspan x="1043" dy="0">Publish the toy guide.</tspan>
    <tspan x="1043" dy="21">Check clarity + accuracy.</tspan>
  </text>
  <text x="1118" y="357" text-anchor="middle" class="micro-copy">publish → check → score</text>
  <path class="micro" d="M 1173 368 C 1173 399, 1062 399, 1062 368"/>
  <rect x="1089" y="377" width="58" height="22" rx="11" fill="#fff8ec"/>
  <text x="1118" y="394" text-anchor="middle" class="micro-copy">improve</text>

  <!-- Deliver -->
  <g filter="url(#shadow)">
    <rect class="node" x="1235" y="210" width="155" height="200" rx="20"/>
  </g>
  <text x="1253" y="240" class="eyebrow">AUTONOMOUS</text>
  <text x="1253" y="276" class="heading">DELIVER</text>
  <text x="1253" y="306" class="body">
    <tspan x="1253" dy="0">Print and inspect.</tspan>
    <tspan x="1253" dy="21">Pack and ship the</tspan>
    <tspan x="1253" dy="21">finished toy.</tspan>
  </text>
  <text x="1253" y="386" class="edge-label">physical proof</text>

  <!-- Reviews -->
  <g filter="url(#shadow)">
    <rect class="node-human" x="1415" y="210" width="145" height="200" rx="20"/>
  </g>
  <text x="1433" y="240" class="eyebrow eyebrow-human">CUSTOMER</text>
  <text x="1433" y="276" class="heading">REVIEWS</text>
  <text x="1433" y="306" class="body">
    <tspan x="1433" dy="0">Live with the toy.</tspan>
    <tspan x="1433" dy="21">Share what worked</tspan>
    <tspan x="1433" dy="21">and what did not.</tspan>
  </text>
  <text x="1433" y="386" class="edge-label-human">human experience</text>

  <!-- AI-player feedback loop -->
  <path class="feedback-ai" d="M 908 420 V 520 C 908 548, 875 560, 845 560 H 755 C 724 560, 703 540, 703 510 V 422"/>
  <rect x="738" y="508" width="136" height="28" rx="14" fill="#eef8ff"/>
  <text x="806" y="527" text-anchor="middle" class="edge-label-ai">issues + suggestions</text>
  <text x="806" y="585" text-anchor="middle" class="body">AI Players send evidence back to Make until Playtest passes.</text>

  <!-- Human review feedback loop -->
  <path class="feedback-human" d="M 1488 420 V 650 C 1488 682, 1456 700, 1422 700 H 570 C 530 700, 503 676, 503 642 V 422"/>
  <rect x="844" y="672" width="314" height="34" rx="17" fill="#f7f1ff"/>
  <text x="1001" y="694" text-anchor="middle" class="edge-label-human">human experience → next revision + future Wishes</text>

  <g transform="translate(50 760)">
    <circle cx="7" cy="0" r="7" fill="#d97706"/>
    <text x="23" y="5" class="body">Micro-loops stop only when their reward function reaches its target.</text>
    <circle cx="620" cy="0" r="7" fill="#1675b8"/>
    <text x="636" y="5" class="body">Playtest improves the current product.</text>
    <circle cx="990" cy="0" r="7" fill="#7c4dcc"/>
    <text x="1006" y="5" class="body">Reviews improve what comes next.</text>
  </g>
</svg>
