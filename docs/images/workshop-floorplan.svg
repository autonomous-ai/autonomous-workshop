<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1720" role="img" aria-labelledby="title description">
  <title id="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</title>
  <desc id="description">A vertical journey through the Workshop from Wish and Match to Invent, Make, Playtest, Instructions, Deliver, and Reviews. Invent, Make, and Instructions have self-improving loops. AI Players send problems back to Make, and customer Reviews inspire the next revision and future Wishes.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525b66"/>
    </marker>
    <marker id="arrow-micro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1675b8"/>
    </marker>
    <marker id="arrow-human" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c4dcc"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .legend { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5560; }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .node-internal { fill: #fff8ec; stroke: #e8a548; stroke-width: 2; }
      .node-ai { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; }
      .node-human { fill: #f7f1ff; stroke: #a782dc; stroke-width: 2; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .eyebrow-internal { fill: #a85e05; }
      .eyebrow-ai { fill: #11689f; }
      .eyebrow-human { fill: #6840aa; }
      .heading { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .micro-copy { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #a85e05; }
      .gate { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a85e05; }
      .gate-ai { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-ai { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-human { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6840aa; }
      .flow { fill: none; stroke: #525b66; stroke-width: 2.5; marker-end: url(#arrow-main); }
      .micro { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#arrow-micro); }
      .feedback-ai { fill: none; stroke: #1675b8; stroke-width: 3; marker-end: url(#arrow-ai); }
      .feedback-human { fill: none; stroke: #7c4dcc; stroke-width: 3; marker-end: url(#arrow-human); }
    </style>
  </defs>

  <rect width="1000" height="1720" rx="28" fill="#f5f2ec"/>

  <text x="50" y="65" class="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</text>

  <g transform="translate(55 112)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#525b66" stroke-width="3"/>
    <text x="40" y="5" class="legend">through the Workshop</text>
    <path d="M 182 2 C 192 19, 216 19, 226 2" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="238" y="5" class="legend">try, score, improve</text>
    <line x1="420" y1="0" x2="450" y2="0" stroke="#1675b8" stroke-width="3"/>
    <text x="460" y="5" class="legend">AI Players send it back</text>
    <line x1="660" y1="0" x2="690" y2="0" stroke="#7c4dcc" stroke-width="3"/>
    <text x="700" y="5" class="legend">players inspire what's next</text>
  </g>

  <!-- Main vertical journey -->
  <path class="flow" d="M 500 280 V 320"/>
  <path class="flow" d="M 500 430 V 470"/>
  <path class="flow" d="M 500 610 V 690"/>
  <path class="flow" d="M 500 830 V 910"/>
  <path class="flow" d="M 500 1050 V 1130"/>
  <path class="flow" d="M 500 1270 V 1350"/>
  <path class="flow" d="M 500 1460 V 1540"/>

  <!-- External feedback lanes -->
  <path class="feedback-ai" d="M 220 980 H 116 C 92 980, 80 966, 80 944 V 786 C 80 766, 94 760, 116 760 H 218"/>
  <path class="feedback-human" d="M 780 1595 H 884 C 912 1595, 925 1577, 925 1554 V 562 C 925 542, 910 540, 884 540 H 782"/>

  <!-- Side-loop labels -->
  <g>
    <rect x="20" y="855" width="164" height="100" rx="16" fill="#eef8ff"/>
    <text x="102" y="880" text-anchor="middle" class="edge-label-ai">AI PLAYERS SAY</text>
    <text x="102" y="903" text-anchor="middle" class="body">what broke</text>
    <text x="102" y="924" text-anchor="middle" class="body">what dragged</text>
    <text x="102" y="945" text-anchor="middle" class="body">back to MAKE</text>
  </g>
  <g>
    <rect x="816" y="985" width="164" height="100" rx="16" fill="#f7f1ff"/>
    <text x="898" y="1010" text-anchor="middle" class="edge-label-human">PLAYERS SAY</text>
    <text x="898" y="1033" text-anchor="middle" class="body">what they loved</text>
    <text x="898" y="1054" text-anchor="middle" class="body">what surprised them</text>
    <text x="898" y="1075" text-anchor="middle" class="body">what they wish for next</text>
  </g>

  <!-- Wish -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="170" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="198" class="eyebrow">YOU IMAGINE IT</text>
  <text x="250" y="230" class="heading">WISH</text>
  <text x="250" y="256" class="body">Say what you want, in your own words.</text>

  <!-- Match -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="320" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="348" class="eyebrow">THE WORKSHOP LISTENS</text>
  <text x="250" y="380" class="heading">MATCH</text>
  <text x="250" y="406" class="body">Find the Inventor who might love this Wish most.</text>

  <!-- Invent -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="470" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="490" x2="600" y2="590" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="497" class="eyebrow eyebrow-internal">AI INVENTOR · SELF-IMPROVING LOOP</text>
  <text x="250" y="531" class="heading">INVENT</text>
  <text x="250" y="558" class="body">Roam the possibilities. Find the toy's shape,</text>
  <text x="250" y="580" class="body">character, play, and spark.</text>
  <path class="micro" d="M 665 498 C 735 472, 764 525, 730 572 C 700 612, 633 583, 646 536"/>
  <text x="697" y="516" text-anchor="middle" class="micro-copy">DREAM</text>
  <text x="697" y="544" text-anchor="middle" class="micro-copy">SCORE</text>
  <text x="697" y="572" text-anchor="middle" class="micro-copy">REFINE</text>

  <!-- Invent gate -->
  <rect x="442" y="637" width="116" height="26" rx="13" fill="#fff8ec"/>
  <text x="500" y="655" text-anchor="middle" class="gate">SPARK FOUND</text>

  <!-- Make -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="690" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="710" x2="600" y2="810" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="717" class="eyebrow eyebrow-internal">AI INVENTOR · SELF-IMPROVING LOOP</text>
  <text x="250" y="751" class="heading">MAKE</text>
  <text x="250" y="778" class="body">Turn the idea into mechanisms and printable parts</text>
  <text x="250" y="800" class="body">that fit, move, and feel right.</text>
  <path class="micro" d="M 665 718 C 735 692, 764 745, 730 792 C 700 832, 633 803, 646 756"/>
  <text x="697" y="736" text-anchor="middle" class="micro-copy">BUILD</text>
  <text x="697" y="764" text-anchor="middle" class="micro-copy">INSPECT</text>
  <text x="697" y="792" text-anchor="middle" class="micro-copy">REFINE</text>

  <!-- Make gate -->
  <rect x="442" y="857" width="116" height="26" rx="13" fill="#fff8ec"/>
  <text x="500" y="875" text-anchor="middle" class="gate">READY TO PLAY</text>

  <!-- Playtest -->
  <g filter="url(#shadow)">
    <rect class="node-ai" x="220" y="910" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="930" x2="600" y2="1030" stroke="#9bc8e8" stroke-width="1.5"/>
  <text x="250" y="938" class="eyebrow eyebrow-ai">AI PLAYERS · FEEDBACK LOOP</text>
  <text x="250" y="972" class="heading">PLAYTEST</text>
  <text x="250" y="997" class="body">Play it all the way through. Try clever,</text>
  <text x="250" y="1017" class="body">strange, and troublesome things.</text>
  <text x="250" y="1037" class="body">Find every reason to send it back.</text>
  <text x="628" y="986" class="edge-label-ai">TROUBLE: MAKE AGAIN</text>
  <text x="628" y="1013" class="edge-label-ai">PASSES: KEEP GOING</text>

  <!-- Playtest gate -->
  <rect x="432" y="1077" width="136" height="26" rx="13" fill="#eef8ff"/>
  <text x="500" y="1095" text-anchor="middle" class="gate-ai">PLAYTEST PASSED</text>

  <!-- Instructions -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="1130" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="1150" x2="600" y2="1250" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="1157" class="eyebrow eyebrow-internal">AI INVENTOR · SELF-IMPROVING LOOP</text>
  <text x="250" y="1191" class="heading">INSTRUCTIONS</text>
  <text x="250" y="1218" class="body">Create the product page, manual, and everything</text>
  <text x="250" y="1240" class="body">the new owner needs to begin.</text>
  <path class="micro" d="M 665 1158 C 735 1132, 764 1185, 730 1232 C 700 1272, 633 1243, 646 1196"/>
  <text x="697" y="1176" text-anchor="middle" class="micro-copy">WRITE</text>
  <text x="697" y="1204" text-anchor="middle" class="micro-copy">FOLLOW</text>
  <text x="697" y="1232" text-anchor="middle" class="micro-copy">POLISH</text>

  <!-- Instructions gate -->
  <rect x="442" y="1297" width="116" height="26" rx="13" fill="#fff8ec"/>
  <text x="500" y="1315" text-anchor="middle" class="gate">CLEAR AS DAY</text>

  <!-- Deliver -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="1350" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1378" class="eyebrow">AUTONOMOUS</text>
  <text x="250" y="1410" class="heading">DELIVER</text>
  <text x="250" y="1436" class="body">Print it, check it by hand, tuck it into a box, and send it to your door.</text>

  <!-- Reviews -->
  <g filter="url(#shadow)">
    <rect class="node-human" x="220" y="1540" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1568" class="eyebrow eyebrow-human">YOU PLAY</text>
  <text x="250" y="1600" class="heading">REVIEWS</text>
  <text x="250" y="1626" class="body">What you say helps this toy grow—and starts the next adventure.</text>

  <text x="500" y="1685" text-anchor="middle" class="subtitle">One Wish in. One never-before-seen toy out.</text>
</svg>
