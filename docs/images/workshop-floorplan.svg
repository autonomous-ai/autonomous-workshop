<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2050" role="img" aria-labelledby="title description">
  <title id="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</title>
  <desc id="description">A journey from Wish into a pluggable agentic runtime, where one root coding-agent session acts as Workshop Manager. A durable private checkpoint resumes that exact session across stages, with per-command caps of three consecutive unfinished native turns or two consecutive recoverable native failures, explicit operator resumes, and supported in-place CLI updates. A concrete operator or environment blocker becomes a typed waiting or failed need that remains visible through Workshop status instead of disappearing into chat. Make binds every exact file while ignoring byte-free directories that a native sandbox may protect from unlink; the trusted host can prune that empty residue for a frozen run before resume. Malformed Make or Playtest proof is quarantined and returned to the same Goal with exact host feedback. Each active stage attempt receives one native Codex Goal whose stopping condition is successful stage finalization. Each new run freezes one effort route: Spark goes through Make and Release, Forge goes through Invent, Make, and Release, and Quest adds Playtest before Release. New Codex Spark runs freeze low reasoning effort, a 64k automatic compaction ceiling, and a 20-minute boundary per native turn. New Forge and Quest runs retain high reasoning while freezing a 32k ceiling, 30-minute turn boundary, and eight-turn command cap. None of these economics profiles weakens product gates. Make's fixed preflight generates every printable and requires strict fit, mesh validity, and 0.4 mm-nozzle thickness. One blind critic binds that passing report, reads form, subjects, action, and relationship, then checks every explicit Wish form constraint and the anti-generic signature with no blocking defect. It permits at most two review rounds and requires one passing full-tier final report. Evidence-bound failures can return Make to Invent, or Quest Playtest directly to Make or Invent, within one shared revision budget. Inventor selection happens inside the first creative stage rather than in a separate Match turn. Release creates one initial and one final manual review packet before handing off to the Operations team for Printing, Deliver, and customer Review.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-main" viewBox="0 0 12 12" markerWidth="24" markerHeight="24" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <polygon points="0,0 12,6 0,12" fill="#525b66"/>
    </marker>
    <marker id="arrow-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1675b8"/>
    </marker>
    <marker id="arrow-human" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c4dcc"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .legend { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5560; }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .node-manager { fill: #f0f5f4; stroke: #56847c; stroke-width: 2.5; }
      .node-internal { fill: #fff8ec; stroke: #e8a548; stroke-width: 2; }
      .node-ai { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; }
      .node-human { fill: #f7f1ff; stroke: #a782dc; stroke-width: 2; }
      .node-ops { fill: #f4f0ff; stroke: #8b6fc0; stroke-width: 2; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .eyebrow-manager { fill: #376b61; }
      .eyebrow-internal { fill: #a85e05; }
      .eyebrow-ai { fill: #11689f; }
      .eyebrow-human { fill: #6840aa; }
      .eyebrow-ops { fill: #604092; }
      .heading { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .pill-now { fill: #376b61; }
      .pill-future { fill: #ffffff; stroke: #82a79f; stroke-width: 1; }
      .pill-now-text { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.6px; fill: #ffffff; }
      .pill-future-text { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.4px; fill: #376b61; }
      .goal-copy { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #a85e05; }
      .gate { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a85e05; }
      .gate-ai { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-ai { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-human { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6840aa; }
      .flow { fill: none; stroke: #525b66; stroke-width: 2.5; marker-end: url(#arrow-main); }
      .feedback-ai { fill: none; stroke: #1675b8; stroke-width: 3; marker-end: url(#arrow-ai); }
      .feedback-human { fill: none; stroke: #7c4dcc; stroke-width: 3; marker-end: url(#arrow-human); }
    </style>
  </defs>

  <rect width="1000" height="2050" rx="28" fill="#f5f2ec"/>
  <text x="50" y="65" class="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</text>

  <g transform="translate(55 112)">
    <g>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#525b66" stroke-width="3"/>
      <text x="40" y="5" class="legend">through the Workshop</text>
    </g>
    <g transform="translate(230 0)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#d97706" stroke-width="3"/>
      <text x="40" y="5" class="legend">one Codex Goal per active stage attempt</text>
    </g>
    <g transform="translate(520 0)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#7c4dcc" stroke-width="3"/>
      <text x="40" y="5" class="legend">players inspire what's next</text>
    </g>
  </g>

  <!-- Main vertical journey -->
  <path class="flow" d="M 500 280 V 320"/>
  <path class="flow" d="M 500 470 V 520"/>
  <path class="flow" d="M 500 660 V 700"/>
  <path class="flow" d="M 500 840 V 900"/>
  <path class="flow" d="M 500 1040 V 1100"/>
  <path class="flow" d="M 500 1240 V 1300"/>
  <path class="flow" d="M 500 1440 V 1510"/>
  <path class="flow" d="M 500 1620 V 1680"/>
  <path class="flow" d="M 500 1790 V 1850"/>

  <!-- Passed-through stages are real bypasses, not empty stage turns. -->
  <path class="flow" d="M 780 590 H 840 V 970 H 780"/>
  <path class="flow" d="M 220 970 H 150 V 1370 H 220"/>
  <text x="846" y="790" class="edge-label-ai">SPARK</text>
  <text x="36" y="1156" class="edge-label-ai">SPARK + FORGE</text>
  <text x="512" y="685" class="edge-label-ai">FORGE + QUEST</text>

  <!-- External feedback lanes -->
  <path class="feedback-human" d="M 780 1905 H 884 C 912 1905, 925 1887, 925 1864 V 252 C 925 232, 910 230, 884 230 H 782"/>

  <!-- Side-loop labels -->
  <g>
    <rect x="816" y="1145" width="164" height="100" rx="16" fill="#f7f1ff"/>
    <text x="898" y="1170" text-anchor="middle" class="edge-label-human">PLAYERS SAY</text>
    <text x="898" y="1193" text-anchor="middle" class="body">what they loved</text>
    <text x="898" y="1214" text-anchor="middle" class="body">what surprised them</text>
    <text x="898" y="1235" text-anchor="middle" class="body">what they wish for next</text>
  </g>

  <!-- Wish -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="170" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="198" class="eyebrow">YOU IMAGINE IT</text>
  <text x="250" y="230" class="heading">WISH</text>
  <text x="250" y="256" class="body">Say what you want, in your own words.</text>

  <!-- Workshop Manager / agentic runtime -->
  <g filter="url(#shadow)">
    <rect class="node-manager" x="180" y="320" width="640" height="150" rx="22"/>
  </g>
  <text x="210" y="348" class="eyebrow eyebrow-manager">PLUGGABLE AGENTIC RUNTIME</text>
  <text x="210" y="380" class="heading">WORKSHOP MANAGER</text>
  <text x="210" y="405" class="body">One root session runs every enabled stage; each attempt gets one native Goal.</text>
  <text x="210" y="426" class="body">Spark: 20m · Forge + Quest: 30m, 8/command; recovery resumes the exact Goal.</text>
  <rect x="230" y="440" width="138" height="22" rx="11" class="pill-future"/>
  <text x="299" y="455" text-anchor="middle" class="pill-future-text">CLAUDE CODE</text>
  <rect x="382" y="440" width="138" height="22" rx="11" class="pill-now"/>
  <text x="451" y="455" text-anchor="middle" class="pill-now-text">CODEX · NOW</text>
  <rect x="534" y="440" width="138" height="22" rx="11" class="pill-future"/>
  <text x="603" y="455" text-anchor="middle" class="pill-future-text">GROK BUILD</text>
  <text x="692" y="455" class="pill-future-text">+ MORE</text>

  <!-- Effort route -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="520" width="560" height="140" rx="20"/>
  </g>
  <text x="250" y="548" class="eyebrow">FREEZE ONE ROUTE FOR THIS RUN</text>
  <text x="250" y="580" class="heading">EFFORT</text>
  <text x="250" y="606" class="body">Spark · Make → Release (Codex low · 64k compact · 20m/turn)</text>
  <text x="250" y="628" class="body">Forge · Invent → Make → Release (high · 32k · 30m/turn)</text>
  <text x="250" y="650" class="body">Quest · Invent → Make → Playtest → Release (high · 32k · 30m/turn)</text>

  <!-- Invent -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="700" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="720" x2="600" y2="820" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="727" class="eyebrow eyebrow-internal">FORGE + QUEST · SELECTION INCLUDED</text>
  <text x="250" y="761" class="heading">INVENT</text>
  <text x="250" y="786" class="body">Choose the Inventor whose Taste fits the Wish.</text>
  <text x="250" y="808" class="body">Research, explore, and fix the selected design.</text>
  <text x="250" y="830" class="body">Brief every part before geometry begins.</text>
  <text x="690" y="749" text-anchor="middle" class="goal-copy">CODEX GOAL</text>
  <text x="690" y="777" text-anchor="middle" class="body">Select + seal</text>
  <text x="690" y="799" text-anchor="middle" class="body">one design</text>

  <!-- Invent gate -->
  <rect x="516" y="856" width="144" height="26" rx="13" fill="#fff8ec"/>
  <text x="588" y="874" text-anchor="middle" class="gate">INVENT VERIFIED</text>

  <!-- Make -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="900" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="920" x2="600" y2="1020" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="927" class="eyebrow eyebrow-internal">ALL ROUTES · SPARK SELECTS HERE</text>
  <text x="250" y="961" class="heading">MAKE</text>
  <text x="250" y="986" class="body">Turn the selected design into mechanical CAD.</text>
  <text x="250" y="1008" class="body">All printables: fit · mesh · 0.4 mm → blind review.</text>
  <text x="250" y="1030" class="body">No blockers · ≤2 rounds · full final gate binds proof.</text>
  <text x="690" y="949" text-anchor="middle" class="goal-copy">CODEX GOAL</text>
  <text x="690" y="977" text-anchor="middle" class="body">Build + prove</text>
  <text x="690" y="999" text-anchor="middle" class="body">exact CAD</text>

  <!-- Make gate -->
  <rect x="516" y="1056" width="144" height="26" rx="13" fill="#fff8ec"/>
  <text x="588" y="1074" text-anchor="middle" class="gate">MAKE VERIFIED</text>

  <!-- Playtest -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="1080" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="1100" x2="600" y2="1200" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="1107" class="eyebrow eyebrow-internal">QUEST ONLY · REPAIR IF NEEDED</text>
  <text x="250" y="1141" class="heading">PLAYTEST</text>
  <text x="250" y="1168" class="body">Inspect the exact build; record deterministic proof.</text>
  <text x="250" y="1190" class="body">Bad proof → same Goal; build → Make; concept → Invent.</text>
  <text x="690" y="1129" text-anchor="middle" class="goal-copy">CODEX GOAL</text>
  <text x="690" y="1157" text-anchor="middle" class="body">Evaluate build</text>
  <text x="690" y="1179" text-anchor="middle" class="body">truthfully</text>

  <!-- Playtest gate -->
  <rect x="516" y="1236" width="164" height="26" rx="13" fill="#fff8ec"/>
  <text x="598" y="1254" text-anchor="middle" class="gate">PLAYTEST VERIFIED</text>

  <!-- Release -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="1300" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="1320" x2="600" y2="1420" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="1327" class="eyebrow eyebrow-internal">ALL ROUTES · MANAGER VERIFIES</text>
  <text x="250" y="1361" class="heading">RELEASE</text>
  <text x="250" y="1386" class="body">Review the in-box manual once.</text>
  <text x="250" y="1408" class="body">Revise coherently; render final.</text>
  <text x="250" y="1430" class="body">Seal CAD + PDF; bind Playtest proof or not-run.</text>
  <text x="690" y="1349" text-anchor="middle" class="goal-copy">CODEX GOAL</text>
  <text x="690" y="1377" text-anchor="middle" class="body">Package exact</text>
  <text x="690" y="1399" text-anchor="middle" class="body">CAD + manual</text>

  <!-- Release gate -->
  <rect x="310" y="1456" width="168" height="26" rx="13" fill="#fff8ec"/>
  <text x="394" y="1474" text-anchor="middle" class="gate">RELEASE VERIFIED</text>

  <rect x="520" y="1464" width="222" height="26" rx="13" fill="#f4f0ff"/>
  <text x="631" y="1482" text-anchor="middle" class="edge-label-human">HANDOFF TO OPERATIONS</text>

  <!-- Printing -->
  <g filter="url(#shadow)">
    <rect class="node-ops" x="220" y="1510" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1538" class="eyebrow eyebrow-ops">OPERATIONS TEAM · PHYSICAL WORK</text>
  <text x="250" y="1570" class="heading">PRINTING</text>
  <text x="250" y="1596" class="body">Print the released CAD and inspect the physical result.</text>

  <!-- Deliver -->
  <g filter="url(#shadow)">
    <rect class="node-ops" x="220" y="1680" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1708" class="eyebrow eyebrow-ops">OPERATIONS TEAM · FULFILLMENT</text>
  <text x="250" y="1740" class="heading">DELIVER</text>
  <text x="250" y="1766" class="body">Check it by hand, tuck it into a box, and send it to your door.</text>

  <!-- Reviews -->
  <g filter="url(#shadow)">
    <rect class="node-human" x="220" y="1850" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1878" class="eyebrow eyebrow-human">YOU PLAY · OPERATIONS LISTENS</text>
  <text x="250" y="1910" class="heading">REVIEW</text>
  <text x="250" y="1936" class="body">What you say helps this toy grow—and starts the next adventure.</text>

  <text x="500" y="2010" text-anchor="middle" class="subtitle">One Wish in. One never-before-seen toy out.</text>

</svg>
