<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2060" role="img" aria-labelledby="title description">
  <title id="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</title>
  <desc id="description">A vertical journey from Wish into a pluggable agentic runtime, where one root coding-agent session acts as Workshop Manager. Codex is implemented now; Claude Code and Grok Build can implement the same boundary later. The Manager matches an Inventor subagent, researches and seals a Concept, and orchestrates product work through Release inside one persistent toy project; the trusted host owns authorized Deliver effects.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-main" viewBox="0 0 12 12" markerWidth="24" markerHeight="24" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <polygon points="0,0 12,6 0,12" fill="#525b66"/>
    </marker>
    <marker id="arrow-micro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1675b8"/>
    </marker>
    <marker id="arrow-human" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c4dcc"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .legend { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5560; }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .node-manager { fill: #f0f5f4; stroke: #56847c; stroke-width: 2.5; }
      .node-internal { fill: #fff8ec; stroke: #e8a548; stroke-width: 2; }
      .node-ai { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; }
      .node-human { fill: #f7f1ff; stroke: #a782dc; stroke-width: 2; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .eyebrow-manager { fill: #376b61; }
      .eyebrow-internal { fill: #a85e05; }
      .eyebrow-ai { fill: #11689f; }
      .eyebrow-human { fill: #6840aa; }
      .heading { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .pill-now { fill: #376b61; }
      .pill-future { fill: #ffffff; stroke: #82a79f; stroke-width: 1; }
      .pill-now-text { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.6px; fill: #ffffff; }
      .pill-future-text { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.4px; fill: #376b61; }
      .micro-copy { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #a85e05; }
      .gate { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a85e05; }
      .gate-ai { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-ai { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-human { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6840aa; }
      .flow { fill: none; stroke: #525b66; stroke-width: 2.5; marker-end: url(#arrow-main); }
      .micro { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#arrow-micro); }
      .feedback-ai { fill: none; stroke: #1675b8; stroke-width: 3; marker-end: url(#arrow-ai); }
      .feedback-human { fill: none; stroke: #7c4dcc; stroke-width: 3; marker-end: url(#arrow-human); }
    </style>
  </defs>

  <rect width="1000" height="2060" rx="28" fill="#f5f2ec"/>
  <text x="50" y="65" class="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</text>

  <g transform="translate(55 112)">
    <g>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#525b66" stroke-width="3"/>
      <text x="40" y="5" class="legend">through the Workshop</text>
    </g>
    <g transform="translate(230 0)">
      <path d="M 0 2 C 6 19, 24 19, 30 2" fill="none" stroke="#d97706" stroke-width="3"/>
      <text x="40" y="5" class="legend">inspect, act, verify, improve</text>
    </g>
    <g transform="translate(460 0)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#1675b8" stroke-width="3"/>
      <text x="40" y="5" class="legend">AI Players send it back</text>
    </g>
    <g transform="translate(690 0)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#7c4dcc" stroke-width="3"/>
      <text x="40" y="5" class="legend">players inspire what's next</text>
    </g>
  </g>

  <!-- Main vertical journey -->
  <path class="flow" d="M 500 280 V 320"/>
  <path class="flow" d="M 500 470 V 520"/>
  <path class="flow" d="M 500 630 V 680"/>
  <path class="flow" d="M 500 820 V 880"/>
  <path class="flow" d="M 500 1020 V 1080"/>
  <path class="flow" d="M 500 1220 V 1280"/>
  <path class="flow" d="M 500 1420 V 1480"/>
  <path class="flow" d="M 500 1620 V 1680"/>
  <path class="flow" d="M 500 1790 V 1850"/>

  <!-- External feedback lanes -->
  <path class="feedback-ai" d="M 220 1350 H 116 C 92 1350, 80 1336, 80 1314 V 1176 C 80 1156, 94 1150, 116 1150 H 218"/>
  <path class="feedback-human" d="M 780 1905 H 884 C 912 1905, 925 1887, 925 1864 V 752 C 925 732, 910 730, 884 730 H 782"/>

  <!-- Side-loop labels -->
  <g>
    <rect x="20" y="1215" width="164" height="100" rx="16" fill="#eef8ff"/>
    <text x="102" y="1240" text-anchor="middle" class="edge-label-ai">AI PLAYERS SAY</text>
    <text x="102" y="1263" text-anchor="middle" class="body">what broke</text>
    <text x="102" y="1284" text-anchor="middle" class="body">what dragged</text>
    <text x="102" y="1305" text-anchor="middle" class="body">back to MAKE</text>
  </g>
  <g>
    <rect x="816" y="1345" width="164" height="100" rx="16" fill="#f7f1ff"/>
    <text x="898" y="1370" text-anchor="middle" class="edge-label-human">PLAYERS SAY</text>
    <text x="898" y="1393" text-anchor="middle" class="body">what they loved</text>
    <text x="898" y="1414" text-anchor="middle" class="body">what surprised them</text>
    <text x="898" y="1435" text-anchor="middle" class="body">what they wish for next</text>
  </g>

  <!-- Wish -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="170" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="198" class="eyebrow">YOU IMAGINE IT</text>
  <text x="250" y="230" class="heading">WISH</text>
  <text x="250" y="256" class="body">Say what you want, in your own words.</text>

  <!-- Workshop Manager / agentic runtime -->
  <g filter="url(#shadow)">
    <rect class="node-manager" x="180" y="320" width="640" height="150" rx="22"/>
  </g>
  <text x="210" y="348" class="eyebrow eyebrow-manager">PLUGGABLE AGENTIC RUNTIME</text>
  <text x="210" y="380" class="heading">WORKSHOP MANAGER</text>
  <text x="210" y="405" class="body">One root coding-agent session orchestrates Match through Release</text>
  <text x="210" y="426" class="body">inside this toy's persistent project; the host owns Deliver effects.</text>
  <rect x="230" y="440" width="138" height="22" rx="11" class="pill-future"/>
  <text x="299" y="455" text-anchor="middle" class="pill-future-text">CLAUDE CODE</text>
  <rect x="382" y="440" width="138" height="22" rx="11" class="pill-now"/>
  <text x="451" y="455" text-anchor="middle" class="pill-now-text">CODEX · NOW</text>
  <rect x="534" y="440" width="138" height="22" rx="11" class="pill-future"/>
  <text x="603" y="455" text-anchor="middle" class="pill-future-text">GROK BUILD</text>
  <text x="692" y="455" class="pill-future-text">+ MORE</text>

  <!-- Match -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="520" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="548" class="eyebrow">THE MANAGER ROUTES A SUBAGENT</text>
  <text x="250" y="580" class="heading">MATCH</text>
  <text x="250" y="606" class="body">Choose the Inventor subagent whose Taste fits this Wish.</text>

  <!-- Invent -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="680" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="700" x2="600" y2="800" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="707" class="eyebrow eyebrow-internal">INVENTOR SUBAGENT · MANAGER REVIEW</text>
  <text x="250" y="741" class="heading">INVENT</text>
  <text x="250" y="766" class="body">Explore many directions in industrial design.</text>
  <text x="250" y="788" class="body">Choose a concept, then shape its character,</text>
  <text x="250" y="810" class="body">play, and spark.</text>
  <path class="micro" d="M 665 708 C 735 682, 764 735, 730 782 C 700 822, 633 793, 646 746"/>
  <text x="697" y="717" text-anchor="middle" class="micro-copy">OBSERVE</text>
  <text x="697" y="739" text-anchor="middle" class="micro-copy">ACT</text>
  <text x="697" y="761" text-anchor="middle" class="micro-copy">VERIFY</text>
  <text x="697" y="783" text-anchor="middle" class="micro-copy">IMPROVE</text>

  <!-- Invent gate -->
  <rect x="516" y="836" width="144" height="26" rx="13" fill="#fff8ec"/>
  <text x="588" y="854" text-anchor="middle" class="gate">INVENT VERIFIED</text>

  <!-- Concept -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="880" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="900" x2="600" y2="1000" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="907" class="eyebrow eyebrow-internal">MANAGER RESEARCHES + DECIDES · HOST DRAWS</text>
  <text x="250" y="941" class="heading">CONCEPT</text>
  <text x="250" y="966" class="body">Research the wish, decide the exact design,</text>
  <text x="250" y="988" class="body">and write one drawing instruction per part</text>
  <text x="250" y="1010" class="body">before any geometry exists.</text>
  <path class="micro" d="M 665 908 C 735 882, 764 935, 730 982 C 700 1022, 633 993, 646 946"/>
  <text x="697" y="917" text-anchor="middle" class="micro-copy">OBSERVE</text>
  <text x="697" y="939" text-anchor="middle" class="micro-copy">ACT</text>
  <text x="697" y="961" text-anchor="middle" class="micro-copy">VERIFY</text>
  <text x="697" y="983" text-anchor="middle" class="micro-copy">IMPROVE</text>

  <!-- Concept gate -->
  <rect x="508" y="1036" width="160" height="26" rx="13" fill="#fff8ec"/>
  <text x="588" y="1054" text-anchor="middle" class="gate">CONCEPT SEALED</text>

  <!-- Make -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="1080" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="1100" x2="600" y2="1200" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="1107" class="eyebrow eyebrow-internal">MANAGER + SPECIALIST SKILLS · ITERATE</text>
  <text x="250" y="1141" class="heading">MAKE</text>
  <text x="250" y="1166" class="body">Turn the sealed concept into mechanical + 3D design.</text>
  <text x="250" y="1188" class="body">Build printable parts that fit, move,</text>
  <text x="250" y="1210" class="body">and feel right.</text>
  <path class="micro" d="M 665 1108 C 735 1082, 764 1135, 730 1182 C 700 1222, 633 1193, 646 1146"/>
  <text x="697" y="1117" text-anchor="middle" class="micro-copy">OBSERVE</text>
  <text x="697" y="1139" text-anchor="middle" class="micro-copy">ACT</text>
  <text x="697" y="1161" text-anchor="middle" class="micro-copy">VERIFY</text>
  <text x="697" y="1183" text-anchor="middle" class="micro-copy">IMPROVE</text>

  <!-- Make gate -->
  <rect x="516" y="1236" width="144" height="26" rx="13" fill="#fff8ec"/>
  <text x="588" y="1254" text-anchor="middle" class="gate">MAKE VERIFIED</text>

  <!-- Playtest -->
  <g filter="url(#shadow)">
    <rect class="node-ai" x="220" y="1280" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="1300" x2="600" y2="1400" stroke="#9bc8e8" stroke-width="1.5"/>
  <text x="250" y="1308" class="eyebrow eyebrow-ai">INDEPENDENT AI PLAYERS · FEEDBACK LOOP</text>
  <text x="250" y="1342" class="heading">PLAYTEST</text>
  <text x="250" y="1367" class="body">Play it all the way through. Try clever,</text>
  <text x="250" y="1387" class="body">strange, and troublesome things.</text>
  <text x="250" y="1407" class="body">Find every reason to send it back.</text>
  <text x="628" y="1356" class="edge-label-ai">TROUBLE: MAKE AGAIN</text>
  <text x="628" y="1383" class="edge-label-ai">PASSES: KEEP GOING</text>

  <!-- Playtest gate -->
  <rect x="530" y="1436" width="136" height="26" rx="13" fill="#eef8ff"/>
  <text x="598" y="1454" text-anchor="middle" class="gate-ai">PLAYTEST PASSED</text>

  <!-- Release -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="1480" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="1500" x2="600" y2="1600" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="1507" class="eyebrow eyebrow-internal">MANAGER · ITERATE + VERIFY</text>
  <text x="250" y="1541" class="heading">RELEASE</text>
  <text x="250" y="1568" class="body">Assemble the manual, product-page facts,</text>
  <text x="250" y="1590" class="body">evidence, attribution, and publication intent.</text>
  <path class="micro" d="M 665 1508 C 735 1482, 764 1535, 730 1582 C 700 1622, 633 1593, 646 1546"/>
  <text x="697" y="1517" text-anchor="middle" class="micro-copy">OBSERVE</text>
  <text x="697" y="1539" text-anchor="middle" class="micro-copy">ACT</text>
  <text x="697" y="1561" text-anchor="middle" class="micro-copy">VERIFY</text>
  <text x="697" y="1583" text-anchor="middle" class="micro-copy">IMPROVE</text>

  <!-- Release gate -->
  <rect x="504" y="1636" width="168" height="26" rx="13" fill="#fff8ec"/>
  <text x="588" y="1654" text-anchor="middle" class="gate">RELEASE VERIFIED</text>

  <!-- Deliver -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="1680" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1708" class="eyebrow">AUTHORIZED PHYSICAL EFFECTS</text>
  <text x="250" y="1740" class="heading">DELIVER</text>
  <text x="250" y="1766" class="body">Print it, check it by hand, tuck it into a box, and send it to your door.</text>

  <!-- Reviews -->
  <g filter="url(#shadow)">
    <rect class="node-human" x="220" y="1850" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1878" class="eyebrow eyebrow-human">YOU PLAY</text>
  <text x="250" y="1910" class="heading">REVIEWS</text>
  <text x="250" y="1936" class="body">What you say helps this toy grow—and starts the next adventure.</text>

  <text x="500" y="2010" text-anchor="middle" class="subtitle">One Wish in. One never-before-seen toy out.</text>

</svg>
