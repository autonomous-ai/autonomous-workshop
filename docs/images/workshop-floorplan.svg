<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1660" role="img" aria-labelledby="title description">
  <title id="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</title>
  <desc id="description">A vertical journey through the Workshop from Wish and Match to Invent, Make, Playtest, Instructions, Deliver, and Reviews. Invent, Make, and Instructions have self-improving loops. AI Players send problems back to Make, and customer Reviews inspire the next revision and future Wishes.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#525b66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-micro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1675b8"/>
    </marker>
    <marker id="arrow-human" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c4dcc"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .legend { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5560; }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .node-internal { fill: #fff8ec; stroke: #e8a548; stroke-width: 2; }
      .node-ai { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; }
      .node-human { fill: #f7f1ff; stroke: #a782dc; stroke-width: 2; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .eyebrow-internal { fill: #a85e05; }
      .eyebrow-ai { fill: #11689f; }
      .eyebrow-human { fill: #6840aa; }
      .heading { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .micro-copy { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #a85e05; }
      .gate { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a85e05; }
      .gate-ai { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-ai { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11689f; }
      .edge-label-human { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6840aa; }
      .flow { fill: none; stroke: #525b66; stroke-width: 2.5; marker-end: url(#arrow-main); }
      .micro { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#arrow-micro); }
      .feedback-ai { fill: none; stroke: #1675b8; stroke-width: 3; marker-end: url(#arrow-ai); }
      .feedback-human { fill: none; stroke: #7c4dcc; stroke-width: 3; marker-end: url(#arrow-human); }
    </style>
  </defs>

  <rect width="1000" height="1660" rx="28" fill="#f5f2ec"/>

  <text x="50" y="65" class="title">A peek inside the Autonomous Workshop: how a Wish becomes a toy</text>

  <g transform="translate(55 112)">
    <g transform="translate(0 0)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#525b66" stroke-width="3"/>
      <text x="40" y="5" class="legend">through the Workshop</text>
    </g>
    <g transform="translate(230 0)">
      <path d="M 0 2 C 6 19, 24 19, 30 2" fill="none" stroke="#d97706" stroke-width="3"/>
      <text x="40" y="5" class="legend">try, score, improve</text>
    </g>
    <g transform="translate(460 0)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#1675b8" stroke-width="3"/>
      <text x="40" y="5" class="legend">AI Players send it back</text>
    </g>
    <g transform="translate(690 0)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#7c4dcc" stroke-width="3"/>
      <text x="40" y="5" class="legend">players inspire what's next</text>
    </g>
  </g>

  <!-- Main vertical journey -->
  <path class="flow" d="M 500 280 V 340"/>
  <path class="flow" d="M 500 450 V 510"/>
  <path class="flow" d="M 500 650 V 710"/>
  <path class="flow" d="M 500 850 V 910"/>
  <path class="flow" d="M 500 1050 V 1110"/>
  <path class="flow" d="M 500 1250 V 1310"/>
  <path class="flow" d="M 500 1420 V 1480"/>

  <!-- External feedback lanes -->
  <path class="feedback-ai" transform="translate(0 40)" d="M 220 940 H 116 C 92 940, 80 926, 80 904 V 766 C 80 746, 94 740, 116 740 H 218"/>
  <path class="feedback-human" transform="translate(0 40)" d="M 780 1495 H 884 C 912 1495, 925 1477, 925 1454 V 562 C 925 542, 910 540, 884 540 H 782"/>

  <!-- Side-loop labels -->
  <g transform="translate(0 40)">
    <rect x="20" y="805" width="164" height="100" rx="16" fill="#eef8ff"/>
    <text x="102" y="830" text-anchor="middle" class="edge-label-ai">AI PLAYERS SAY</text>
    <text x="102" y="853" text-anchor="middle" class="body">what broke</text>
    <text x="102" y="874" text-anchor="middle" class="body">what dragged</text>
    <text x="102" y="895" text-anchor="middle" class="body">back to MAKE</text>
  </g>
  <g transform="translate(0 40)">
    <rect x="816" y="935" width="164" height="100" rx="16" fill="#f7f1ff"/>
    <text x="898" y="960" text-anchor="middle" class="edge-label-human">PLAYERS SAY</text>
    <text x="898" y="983" text-anchor="middle" class="body">what they loved</text>
    <text x="898" y="1004" text-anchor="middle" class="body">what surprised them</text>
    <text x="898" y="1025" text-anchor="middle" class="body">what they wish for next</text>
  </g>

  <!-- Wish -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="170" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="198" class="eyebrow">YOU IMAGINE IT</text>
  <text x="250" y="230" class="heading">WISH</text>
  <text x="250" y="256" class="body">Say what you want, in your own words.</text>

  <!-- Match -->
  <g transform="translate(0 20)">
    <g filter="url(#shadow)">
      <rect class="node" x="220" y="320" width="560" height="110" rx="20"/>
    </g>
    <text x="250" y="348" class="eyebrow">THE WORKSHOP LISTENS</text>
    <text x="250" y="380" class="heading">MATCH</text>
    <text x="250" y="406" class="body">Find the Inventor who might love this Wish most.</text>
  </g>

  <g transform="translate(0 40)">
  <!-- Invent -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="470" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="490" x2="600" y2="590" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="497" class="eyebrow eyebrow-internal">AI INVENTOR · SELF-IMPROVING LOOP</text>
  <text x="250" y="531" class="heading">INVENT</text>
  <text x="250" y="558" class="body">Roam the possibilities. Find the toy's shape,</text>
  <text x="250" y="580" class="body">character, play, and spark.</text>
  <path class="micro" d="M 665 498 C 735 472, 764 525, 730 572 C 700 612, 633 583, 646 536"/>
  <text x="697" y="516" text-anchor="middle" class="micro-copy">DREAM</text>
  <text x="697" y="544" text-anchor="middle" class="micro-copy">SCORE</text>
  <text x="697" y="572" text-anchor="middle" class="micro-copy">REFINE</text>

  <!-- Invent gate -->
  <rect x="442" y="626" width="116" height="26" rx="13" fill="#fff8ec"/>
  <text x="500" y="644" text-anchor="middle" class="gate">SPARK FOUND</text>

  <!-- Make -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="670" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="690" x2="600" y2="790" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="697" class="eyebrow eyebrow-internal">AI INVENTOR · SELF-IMPROVING LOOP</text>
  <text x="250" y="731" class="heading">MAKE</text>
  <text x="250" y="758" class="body">Turn the idea into mechanisms and printable parts</text>
  <text x="250" y="780" class="body">that fit, move, and feel right.</text>
  <path class="micro" d="M 665 698 C 735 672, 764 725, 730 772 C 700 812, 633 783, 646 736"/>
  <text x="697" y="716" text-anchor="middle" class="micro-copy">BUILD</text>
  <text x="697" y="744" text-anchor="middle" class="micro-copy">INSPECT</text>
  <text x="697" y="772" text-anchor="middle" class="micro-copy">REFINE</text>

  <!-- Make gate -->
  <rect x="442" y="826" width="116" height="26" rx="13" fill="#fff8ec"/>
  <text x="500" y="844" text-anchor="middle" class="gate">READY TO PLAY</text>

  <!-- Playtest -->
  <g filter="url(#shadow)">
    <rect class="node-ai" x="220" y="870" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="890" x2="600" y2="990" stroke="#9bc8e8" stroke-width="1.5"/>
  <text x="250" y="898" class="eyebrow eyebrow-ai">AI PLAYERS · FEEDBACK LOOP</text>
  <text x="250" y="932" class="heading">PLAYTEST</text>
  <text x="250" y="957" class="body">Play it all the way through. Try clever,</text>
  <text x="250" y="977" class="body">strange, and troublesome things.</text>
  <text x="250" y="997" class="body">Find every reason to send it back.</text>
  <text x="628" y="946" class="edge-label-ai">TROUBLE: MAKE AGAIN</text>
  <text x="628" y="973" class="edge-label-ai">PASSES: KEEP GOING</text>

  <!-- Playtest gate -->
  <rect x="432" y="1026" width="136" height="26" rx="13" fill="#eef8ff"/>
  <text x="500" y="1044" text-anchor="middle" class="gate-ai">PLAYTEST PASSED</text>

  <!-- Instructions -->
  <g filter="url(#shadow)">
    <rect class="node-internal" x="220" y="1070" width="560" height="140" rx="20"/>
  </g>
  <line x1="600" y1="1090" x2="600" y2="1190" stroke="#edc58a" stroke-width="1.5"/>
  <text x="250" y="1097" class="eyebrow eyebrow-internal">AI INVENTOR · SELF-IMPROVING LOOP</text>
  <text x="250" y="1131" class="heading">INSTRUCTIONS</text>
  <text x="250" y="1158" class="body">Create the product page, manual, and everything</text>
  <text x="250" y="1180" class="body">the new owner needs to begin.</text>
  <path class="micro" d="M 665 1098 C 735 1072, 764 1125, 730 1172 C 700 1212, 633 1183, 646 1136"/>
  <text x="697" y="1116" text-anchor="middle" class="micro-copy">WRITE</text>
  <text x="697" y="1144" text-anchor="middle" class="micro-copy">FOLLOW</text>
  <text x="697" y="1172" text-anchor="middle" class="micro-copy">POLISH</text>

  <!-- Instructions gate -->
  <rect x="442" y="1226" width="116" height="26" rx="13" fill="#fff8ec"/>
  <text x="500" y="1244" text-anchor="middle" class="gate">CLEAR AS DAY</text>

  <!-- Deliver -->
  <g filter="url(#shadow)">
    <rect class="node" x="220" y="1270" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1298" class="eyebrow">AUTONOMOUS</text>
  <text x="250" y="1330" class="heading">DELIVER</text>
  <text x="250" y="1356" class="body">Print it, check it by hand, tuck it into a box, and send it to your door.</text>

  <!-- Reviews -->
  <g filter="url(#shadow)">
    <rect class="node-human" x="220" y="1440" width="560" height="110" rx="20"/>
  </g>
  <text x="250" y="1468" class="eyebrow eyebrow-human">YOU PLAY</text>
  <text x="250" y="1500" class="heading">REVIEWS</text>
  <text x="250" y="1526" class="body">What you say helps this toy grow—and starts the next adventure.</text>

  <text x="500" y="1585" text-anchor="middle" class="subtitle">One Wish in. One never-before-seen toy out.</text>
  </g>
</svg>
