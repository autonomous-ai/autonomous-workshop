<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" role="img" aria-labelledby="title description">
  <title id="title">Forge effort route: Wish to Invent to Make to Release</title>
  <desc id="description">Forge is the balanced Autonomous Workshop route. Each active stage attempt receives one Codex Goal. Inventor selection happens inside Invent, followed by Make and Release. A fixed preflight generates every printable and requires strict fit, mesh validity, and 0.4 mm-nozzle thickness before one independent critic blindly reads the exact form, subjects, action, and relationship. The critic binds that passing report, then checks every explicit held-form constraint and the anti-generic signature with no blocking visual defect. Make permits at most two review rounds, then requires one passing full-tier CAD report. If exact evidence proves the sealed concept prevents a conforming build, Make can return to a new Invent Goal within the shared revision budget. Playtest is passed through without a turn, artifact, gate, or evidence. Release verifies the CAD and manual, records Playtest as not-run, publishes with public hash readback, and hands the product to Operations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><polygon points="0,0 12,6 0,12" fill="#525b66"/></marker>
    <marker id="arrow-repair" viewBox="0 0 12 12" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><polygon points="0,0 12,6 0,12" fill="#d97706"/></marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .eyebrow { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #747c85; }
      .heading { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #515a65; }
      .small { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #626b76; }
      .route { fill: none; stroke: #525b66; stroke-width: 3; marker-end: url(#arrow); }
      .repair { fill: none; stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow-repair); }
      .node { fill: #ffffff; stroke: #d7d3cc; stroke-width: 2; }
      .manager { fill: #f0f5f4; stroke: #56847c; stroke-width: 2; }
      .active { fill: #fff8ec; stroke: #e8a548; stroke-width: 2.5; }
      .skip { fill: #eef8ff; stroke: #67aee0; stroke-width: 2; stroke-dasharray: 8 6; }
      .ops { fill: #f4f0ff; stroke: #8b6fc0; stroke-width: 2.5; }
      .orange { fill: #a85e05; }
      .blue { fill: #11689f; }
      .purple { fill: #604092; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#f5f2ec"/>
  <text x="55" y="64" class="eyebrow orange">FORGE · BALANCED ROUTE</text>
  <text x="55" y="108" class="title">Explore the idea, then engineer it.</text>
  <text x="55" y="139" class="subtitle">Invent adds dedicated research and concept exploration before Make; Playtest remains truthfully omitted.</text>

  <g filter="url(#shadow)"><rect x="55" y="185" width="1090" height="68" rx="18" class="manager"/></g>
  <text x="83" y="212" class="eyebrow" fill="#376b61">WORKSHOP MANAGER</text>
  <text x="83" y="237" class="body">The host freezes Forge and owns gates + publication; each active attempt gets one Codex Goal.</text>

  <path class="route" d="M 195 355 H 240"/>
  <path class="route" d="M 450 355 H 495"/>
  <path class="route" d="M 705 355 H 750"/>
  <path class="route" d="M 960 355 H 1005"/>

  <g filter="url(#shadow)"><rect x="55" y="295" width="140" height="120" rx="20" class="node"/></g>
  <text x="78" y="325" class="eyebrow">YOU IMAGINE</text>
  <text x="78" y="359" class="heading">WISH</text>
  <text x="78" y="386" class="body">Exact words.</text>

  <g filter="url(#shadow)"><rect x="240" y="285" width="210" height="150" rx="20" class="active"/></g>
  <text x="265" y="315" class="eyebrow orange">CODEX GOAL · INVENT</text>
  <text x="265" y="350" class="heading">INVENT</text>
  <text x="265" y="377" class="body">Choose the Inventor.</text>
  <text x="265" y="399" class="body">Research + explore.</text>
  <text x="265" y="421" class="body">Verify the concept.</text>

  <g filter="url(#shadow)"><rect x="495" y="285" width="210" height="150" rx="20" class="active"/></g>
  <text x="520" y="315" class="eyebrow orange">CODEX GOAL · MAKE</text>
  <text x="520" y="350" class="heading">MAKE</text>
  <text x="520" y="377" class="body">Build mechanical CAD.</text>
  <text x="520" y="399" class="body">All parts preflight → review.</text>
  <text x="520" y="421" class="body">No blockers → full final gate.</text>

  <g filter="url(#shadow)"><rect x="750" y="285" width="210" height="150" rx="20" class="active"/></g>
  <text x="775" y="315" class="eyebrow orange">CODEX GOAL · RELEASE</text>
  <text x="775" y="350" class="heading">RELEASE</text>
  <text x="775" y="377" class="body">Seal CAD + manual.</text>
  <text x="775" y="399" class="body">Read back hashes.</text>
  <text x="775" y="421" class="body">Playtest: not-run.</text>

  <g filter="url(#shadow)"><rect x="1005" y="295" width="140" height="120" rx="20" class="ops"/></g>
  <text x="1028" y="325" class="eyebrow purple">HANDOFF</text>
  <text x="1028" y="359" class="heading">OPS</text>
  <text x="1028" y="386" class="body">Print · Deliver</text>

  <path class="repair" d="M 600 445 V 477 H 345 V 445"/>
  <text x="472" y="499" text-anchor="middle" class="small orange">PROVEN CONCEPT BLOCK → NEW INVENT GOAL · SHARED REVISION BUDGET</text>

  <text x="55" y="541" class="eyebrow orange">SELECTION LOCATION</text>
  <g filter="url(#shadow)"><rect x="55" y="565" width="520" height="112" rx="18" class="active"/></g>
  <text x="82" y="598" class="heading">NO SEPARATE MATCH TURN</text>
  <text x="82" y="625" class="body">Match is not a stage in new runs. Inventor selection happens in Invent.</text>
  <text x="82" y="652" class="small orange">ONE INVENT GOAL · ASSIGNMENT + INVENTED ARTIFACTS</text>

  <text x="625" y="541" class="eyebrow blue">TRUE PASS-THROUGH</text>
  <g filter="url(#shadow)"><rect x="625" y="565" width="520" height="112" rx="18" class="skip"/></g>
  <text x="652" y="598" class="heading">PLAYTEST</text>
  <text x="652" y="625" class="body">Not run. Release makes no Playtest claim and carries no Playtest evidence.</text>
  <text x="652" y="652" class="small blue">NO TURN · NO ARTIFACT · NO GATE · NO EVIDENCE</text>

  <g filter="url(#shadow)"><rect x="55" y="730" width="1090" height="78" rx="18" fill="#ffffff" stroke="#d7d3cc" stroke-width="2"/></g>
  <text x="82" y="761" class="eyebrow purple">OPERATIONS HANDOFF</text>
  <text x="82" y="788" class="body">Workshop ends only after authenticated publication and exact-byte readback; printing and delivery begin afterward.</text>
</svg>
