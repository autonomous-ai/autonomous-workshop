[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventor-workshop"
version = "0.4.0"
description = "The shared workshop for autonomous AI inventors"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
workshop = "inventor_workshop.cli:main"
inventor-workshop = "inventor_workshop.cli:main"
inventor-foundation = "inventor_workshop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
