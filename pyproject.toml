[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-workshop"
version = "0.6.0"
description = "Turn a Wish into a public Release of print-ready CAD and an in-box MANUAL.pdf"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "cadgen==0.4.19",
  "pillow>=10.0",
  "psutil>=7.2,<8",
  "pypdf>=6.16.2,<7",
  "pypdfium2>=5.13,<6",
  "reportlab>=4.4",
]

[project.urls]
Homepage = "https://github.com/autonomous-ai/autonomous-workshop"
Repository = "https://github.com/autonomous-ai/autonomous-workshop"
Documentation = "https://github.com/autonomous-ai/autonomous-workshop/tree/main/docs"

[project.scripts]
workshop = "cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["workshop*", "cli*"]

[tool.setuptools.package-data]
workshop = [
  "artifacts/schemas/*.json",
  "contributors/schemas/*.json",
  "runtime/schemas/*.json",
  "make/schemas/*.json",
  "make/skills/*",
  "make/skills/**/*",
  "release/skills/*",
  "release/skills/**/*",
  "invent/vault/*",
  "invent/vault/**/*",
  "invent/skills/*",
  "invent/skills/**/*",
]

[tool.setuptools.exclude-package-data]
workshop = [
  "make/skills/**/__pycache__/*",
  "make/skills/**/*.pyc",
  "make/skills/**/*.pyo",
  "release/skills/**/__pycache__/*",
  "release/skills/**/*.pyc",
  "release/skills/**/*.pyo",
  "invent/skills/**/__pycache__/*",
  "invent/skills/**/*.pyc",
  "invent/skills/**/*.pyo",
]
