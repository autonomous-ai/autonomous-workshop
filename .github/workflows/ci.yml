# Inventor CI — deterministic, credential-free gates for the shared Workshop and
# every native inventor persona. Imported upstream snapshots are validated by
# their pinned provenance records rather than by installing their undeclared
# or environment-specific dependency trees.
name: autonomous-workshop-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: reject tracked secrets and backups
        run: python tools/scan_secrets.py
      - name: verify canonical making skills are discoverable
        env:
          PYTHONPATH: src
        run: python -m cli skills list
      - name: verify reviewed making-skill fingerprints
        run: python tools/verify_skill_locks.py
      - name: verify installed schemas are discoverable
        env:
          PYTHONPATH: src
        run: python -m cli schemas list
      - name: verify pinned inventor snapshot bytes and modes
        run: python tools/verify_snapshot_locks.py

  native-persona-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: validate every inventor as a native Taste-only persona
        env:
          PYTHONPATH: src
        run: |
          python -m cli inventors --root inventors --check-entrypoints
          python -m cli check inventors --run

  workshop-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Workshop contract tests
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: installed Workshop carries skills, schemas, and runnable scaffolds
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          workshop skills list
          workshop schemas list
          mkdir -p "$RUNNER_TEMP/generated-inventors"
          workshop new ci-inventor --name CI --niche "offline printable tests" --root "$RUNNER_TEMP/generated-inventors"
          python -m pip install --no-deps "$RUNNER_TEMP/generated-inventors/ci-inventor"
          mkdir -p "$RUNNER_TEMP/away"
          cd "$RUNNER_TEMP/away"
          CI_INVENTOR_RUNTIME="$RUNNER_TEMP/ci-runtime" ci_inventor doctor
          test ! -e "$RUNNER_TEMP/ci-runtime"
          CI_INVENTOR_RUNTIME="$RUNNER_TEMP/ci-runtime" ci_inventor make first-product
          CI_INVENTOR_RUNTIME="$RUNNER_TEMP/ci-runtime" ci_inventor status
      - name: installed wheel supports the no-root customer journey
        if: matrix.python-version == '3.14'
        run: python tests/packaging/installed_wheel_cli_acceptance.py

  distribution-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ZIP cannot represent earlier dates. Pinning this makes both wheel build
      # paths reproducible instead of comparing wall-clock timestamps.
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: build direct wheel and source distribution independently
        run: |
          python -m pip install build "setuptools>=77" wheel
          python -m build --wheel --outdir dist/direct
          python -m build --sdist --outdir dist/source
      - name: rebuild a wheel from the source distribution
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir "$RUNNER_TEMP/from-sdist" dist/source/autonomous_workshop-*.tar.gz
      - name: verify direct and source-rebuilt wheels are byte-identical
        run: python -c 'from pathlib import Path; direct = next(Path("dist/direct").glob("autonomous_workshop-*.whl")); rebuilt = next(Path("${{ runner.temp }}/from-sdist").glob("autonomous_workshop-*.whl")); assert direct.read_bytes() == rebuilt.read_bytes(), (direct, rebuilt)'
      - name: exercise the direct wheel outside the checkout
        run: python tests/packaging/installed_wheel_cli_acceptance.py --wheel dist/direct/autonomous_workshop-*.whl
      - name: exercise the source-rebuilt wheel outside the checkout
        run: python tests/packaging/installed_wheel_cli_acceptance.py --wheel "$RUNNER_TEMP"/from-sdist/autonomous_workshop-*.whl
