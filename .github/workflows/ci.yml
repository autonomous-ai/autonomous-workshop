# Inventor CI — deterministic, credential-free gates for the shared Workshop and
# every native inventor harness. Imported upstream snapshots are validated by
# their pinned provenance records rather than by installing their undeclared
# or environment-specific dependency trees.
name: autonomous-workshop-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: reject tracked secrets and backups
        run: python tools/scan_secrets.py
      - name: verify canonical making skills are discoverable
        env:
          PYTHONPATH: src
        run: python -m inventor_workshop skills list
      - name: verify reviewed making-skill fingerprints
        run: python tools/verify_skill_locks.py
      - name: verify installed schemas are discoverable
        env:
          PYTHONPATH: src
        run: python -m inventor_workshop schemas list
      - name: validate inventor registry
        env:
          PYTHONPATH: src
        run: python -m inventor_workshop inventors --root inventors --check-entrypoints
      - name: run inventor contribution checks
        env:
          PYTHONPATH: src
        run: python -m inventor_workshop check inventors --run
      - name: verify pinned inventor snapshot bytes and modes
        run: python tools/verify_snapshot_locks.py

  workshop-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Workshop contract tests
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: installed Workshop carries skills, schemas, and runnable scaffolds
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          workshop skills list
          workshop schemas list
          mkdir -p "$RUNNER_TEMP/generated-inventors"
          workshop create inventor ci-inventor --name CI --description "offline printable tests" --lane invented-games --root "$RUNNER_TEMP/generated-inventors"
          python -m pip install --no-deps "$RUNNER_TEMP/generated-inventors/inventors/ci-inventor"
          mkdir -p "$RUNNER_TEMP/away"
          cd "$RUNNER_TEMP/away"
          CI_INVENTOR_RUNTIME="$RUNNER_TEMP/ci-runtime" ci_inventor profile
          test ! -e "$RUNNER_TEMP/ci-runtime"
          CI_INVENTOR_RUNTIME="$RUNNER_TEMP/ci-runtime" ci_inventor preview first-product "I wish for a tiny printable game"
          test ! -e "$RUNNER_TEMP/ci-runtime"
          CI_INVENTOR_RUNTIME="$RUNNER_TEMP/ci-runtime" WORKSHOP_AGENT_WORKERS=disabled ci_inventor run --playtest-rounds 2 first-product "I wish for a tiny printable game"
          test -f "$RUNNER_TEMP/ci-runtime/workshop.sqlite3"
      - name: installed wheel supports the no-root customer journey
        if: matrix.python-version == '3.13'
        run: python tests/installed_wheel_cli_acceptance.py
      - name: installed wheel orchestrates all five profiles with deterministic external boundaries
        if: matrix.python-version == '3.13'
        run: python tests/installed_all_five_cli_acceptance.py

  bob-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      BOB_MOCK_AGENTS: "1"
    defaults:
      run:
        working-directory: inventors/bob
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install Workshop
        run: python -m pip install ../..
      - name: unit tests (stdlib unittest only, no pytest)
        run: python -m unittest discover -s tests -v

  alice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: inventors/alice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install Alice and shared Workshop
        run: python -m pip install ../.. .
      - name: unit tests (warnings are errors)
        env:
          PYTHONWARNINGS: error
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: installed CLI smoke test
        env:
          PYTHONWARNINGS: error
        run: |
          runtime="$RUNNER_TEMP/alice-smoke-${{ matrix.python-version }}"
          alice --root "$runtime" init
          alice --root "$runtime" learning-init
          alice --root "$runtime" eval
          alice --root "$runtime" doctor

  alice-macos-service:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: inventors/alice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install Alice and shared Workshop
        run: python -m pip install ../.. .
      - name: service snapshot tests on the declared deployment OS
        env:
          PYTHONWARNINGS: error
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_service.py' -v
      - name: verify real custom-contribution isolation
        working-directory: .
        env:
          PYTHONPATH: src
          WORKSHOP_REQUIRE_MACOS_ISOLATION_TEST: "1"
        run: >-
          python -m unittest -v
          tests.test_contribution_rpc.ContributionRpcTest.test_real_macos_sandbox_blocks_inventor_state_write_read_and_network
