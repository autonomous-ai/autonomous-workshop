# Deterministic, credential-free gates for the native Workshop host, its
# product-run assets, and every bundled Inventor specialist.
name: autonomous-workshop-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install the locked dependency tool
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: reject a stale dependency lock
        run: uv lock --check
      - name: reject tracked secrets and backups
        run: python tools/scan_secrets.py
      - name: verify canonical making skills are discoverable
        env:
          PYTHONPATH: src
        run: python -m cli skills list
      - name: verify reviewed making-skill fingerprints
        run: python tools/verify_skill_locks.py
      - name: verify installed schemas are discoverable
        env:
          PYTHONPATH: src
        run: python -m cli schemas list
      - name: validate bundled inventor catalog
        env:
          PYTHONPATH: src
        run: python -m cli inventors --root inventors
      - name: statically validate inventor contributions
        env:
          PYTHONPATH: src
        run: python -m cli check inventors

  workshop-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Workshop contract tests
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: installed Workshop carries skills, schemas, Inventors, and runtime assets
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install --no-deps .
          cd "$RUNNER_TEMP"
          workshop skills list
          workshop schemas list
          workshop inventors
          python -c 'from workshop.runtime.agent_assets import product_run_agent_assets; assets = product_run_agent_assets(); assert assets.constitution.is_file(); assert (assets.skill_root / "SKILL.md").is_file()'
      - name: installed wheel supports the no-root customer journey
        if: matrix.python-version == '3.14'
        run: python tests/packaging/installed_wheel_cli_acceptance.py

  deterministic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install the locked dependency tool
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run production-boundary deterministic E2E
        env:
          WORKSHOP_RUN_DETERMINISTIC_E2E: "1"
        run: |
          started_at=$(date +%s)
          uv run --frozen python -m unittest \
            tests.end_to_end.test_deterministic_native_fidelity -v
          elapsed_seconds=$(($(date +%s) - started_at))
          echo "Deterministic E2E runtime: ${elapsed_seconds}s" >> "$GITHUB_STEP_SUMMARY"

  distribution-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ZIP cannot represent earlier dates. Pinning this makes both wheel build
      # paths reproducible instead of comparing wall-clock timestamps.
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: seed stale package build output
        run: |
          mkdir -p build/lib/workshop build/lib/cli
          touch build/lib/workshop/removed_packaging_sentinel.py
          touch build/lib/cli/removed_packaging_sentinel.py
      - name: build direct wheel and source distribution independently
        run: |
          python -m pip install "build==1.6.0" "setuptools==84.0.0" "wheel==0.48.0"
          python -m build --wheel --outdir dist/direct
          python -m build --sdist --outdir dist/source
      - name: rebuild a wheel from the source distribution
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir "$RUNNER_TEMP/from-sdist" dist/source/autonomous_workshop-*.tar.gz
      - name: verify direct and source-rebuilt wheels are byte-identical
        run: python -c 'from pathlib import Path; direct = next(Path("dist/direct").glob("autonomous_workshop-*.whl")); rebuilt = next(Path("${{ runner.temp }}/from-sdist").glob("autonomous_workshop-*.whl")); assert direct.read_bytes() == rebuilt.read_bytes(), (direct, rebuilt)'
      - name: exercise the direct wheel outside the checkout
        run: python tests/packaging/installed_wheel_cli_acceptance.py --with-dependencies --wheel dist/direct/autonomous_workshop-*.whl
      - name: exercise the source-rebuilt wheel outside the checkout
        run: python tests/packaging/installed_wheel_cli_acceptance.py --wheel "$RUNNER_TEMP"/from-sdist/autonomous_workshop-*.whl
